[package]
name = "ssf"
version = "0.1.0"
edition = "2021"
description = "Shopping Sessions: generator-aware fast path with hand-off to the general pipeline."
license = "MIT"
publish = false

[[bin]]
name = "ssf"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
incremental = false

[profile.dev]
opt-level = 1
