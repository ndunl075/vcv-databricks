[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
description = "Shopping Sessions track: exact, fast CSV -> Parquet sessionization pipeline (no dependencies)."
license = "MIT"
publish = false

[[bin]]
name = "ss"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
incremental = false

[profile.dev]
opt-level = 1
