name: bench
# Real-x86 stopwatch: time two refs of this repo back to back on a hosted runner, on stock and reshuffled-ID data.
# Trigger from the Mac with ci/bench.sh.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: commit or branch to time
        default: core
      baseline:
        description: second ref, timed back to back
        default: 223ecb7
      events:
        description: events in the generated dataset
        default: "20000000"
      seed:
        description: generator seed
        default: "7"
      runs:
        description: timed runs per image per dataset
        default: "5"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VCV_CI_WORK: /home/runner/vcv-ci
      EVENTS: ${{ inputs.events }}
      SEED: ${{ inputs.seed }}
      RUNS: ${{ inputs.runs }}
      IN_REF: ${{ inputs.ref }}
      IN_BASE: ${{ inputs.baseline }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Machine
        run: |
          echo "nproc: $(nproc)"; free -m; df -h / | tail -1
          grep -m1 'model name' /proc/cpuinfo
          for f in avx2 avx512f avx512bw; do grep -qm1 -w $f /proc/cpuinfo && echo "$f: yes" || echo "$f: NO"; done
      - name: Source trees
        run: |
          ci/prep_src.sh ref="$IN_REF" base="$IN_BASE" | tee /tmp/shas
          echo "REF_SHA=$(sed -n 's/^ref=//p' /tmp/shas)" >> "$GITHUB_ENV"
          echo "BASE_SHA=$(sed -n 's/^base=//p' /tmp/shas)" >> "$GITHUB_ENV"
          echo "REF_NAME=$IN_REF" >> "$GITHUB_ENV"
          echo "BASE_NAME=$IN_BASE" >> "$GITHUB_ENV"
          echo "MUT_KEY=$(git rev-parse origin/bench:bench/ood/mutate.py)" >> "$GITHUB_ENV"
      - name: Checker deps
        run: |
          python3 -m venv /home/runner/venv && /home/runner/venv/bin/pip install -q --only-binary :all: polars
          echo /home/runner/venv/bin >> "$GITHUB_PATH"
      - name: Dataset cache
        id: cache
        uses: actions/cache@v4
        with:
          path: /home/runner/vcv-ci/data
          key: data-v1-${{ inputs.events }}-${{ inputs.seed }}-${{ env.MUT_KEY }}
      - name: Datasets
        run: BENCH_SRC="$VCV_CI_WORK/src/bench" ci/prep_data.sh "$EVENTS" "$SEED"
      - name: Time
        run: python3 ci/bench_run.py
      - name: Summary
        if: always()
        run: |
          [ -f "$VCV_CI_WORK/report/summary.md" ] && cat "$VCV_CI_WORK/report/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: |
            /home/runner/vcv-ci/report/results.json
            /home/runner/vcv-ci/report/summary.md
